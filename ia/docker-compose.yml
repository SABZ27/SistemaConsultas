# MODO DOCKER (alternativo). Solo Open WebUI; Ollama corre nativo en Windows.
# Uso: cd ia; docker compose --env-file .env up -d
# La imagen va FIJADA a una version estable (no :main, que es rolling).
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.0
    container_name: open-webui-ia
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped

volumes:
  open-webui-data:
